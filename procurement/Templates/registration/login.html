{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AFRAA Fuel System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'procurement/css/aviation.css' %}">
</head>
<body class="twilight-bg">

    <div class="container py-5 d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="glass-cockpit-card">
            <h2 class="text-center mb-2 brand-glow-text">AFRAA Fuel System</h2>
            <p class="text-center mb-4 text-white-50">Sign in to the Operations Control Center</p>
            
            {% if form.errors %}
                <div class="alert alert-danger" style="background: rgba(255, 77, 77, 0.1); border-color: rgba(255, 77, 77, 0.2); color: #ff6b6b;">
                    Your account is inactive pending admin approval, or invalid username/password.
                </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                
                <div class="mb-4">
                    <label class="form-label text-white">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" autofocus required>
                </div>
                
                <div class="mb-4">
                    <label class="form-label text-white">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn btn-aviation-glow w-100 mb-3">Sign In</button>
                <input type="hidden" name="next" value="{{ next }}">
                
                <div class="text-center mt-3">
                    <span class="text-white-50" style="font-size: 0.9rem;">Don't have an account? <a href="{% url 'register' %}" class="brand-glow-text" style="text-decoration: none;">Register here</a></span>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
