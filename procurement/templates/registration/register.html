{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AFRAA Fuel System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'procurement/css/aviation.css' %}">
    <style>
        /* Form styling adjustments for Django form output inside twilight card */
        #form-container input:not([type="radio"]):not([type="checkbox"]),
        #form-container select,
        #form-container textarea {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #fff !important;
            border-radius: 0.5rem !important;
            padding: 0.65rem 1rem !important;
            width: 100%;
            margin-bottom: 1.25rem;
            display: block;
            transition: all 0.2s ease;
        }
        #form-container input:focus, #form-container select:focus {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: var(--sky-glow) !important;
            color: #fff !important;
            outline: none;
            box-shadow: 0 0 0 0.25rem rgba(0, 210, 255, 0.25) !important;
        }
        #form-container label {
            font-size: 0.9rem;
            font-weight: 500;
            color: #fff;
            margin-bottom: 0.5rem;
            display: inline-block;
        }
        #form-container ul {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }
        #form-container .helptext {
            display: block;
            font-size: 0.75rem;
            color: #cbd5e1;
            margin-top: -0.5rem;
            margin-bottom: 1.25rem;
        }
        #form-container .errorlist {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        #form-container input[type="radio"] {
            margin-right: 0.5rem;
            accent-color: #00d2ff;
        }
        #form-container label[for^="id_account_type_"] {
            display: inline-flex;
            align-items: center;
            margin-right: 1.5rem;
            color: #e2e8f0;
            cursor: pointer;
        }
    </style>
</head>
<body class="twilight-bg">

    <div class="container py-5 d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="glass-cockpit-card">
            <h2 class="text-center mb-2 brand-glow-text">Create Account</h2>
            <p class="text-center mb-4 text-white-50">Join the AFRAA Operations Control</p>
            
            <form method="post" action="{% url 'register' %}">
                {% csrf_token %}
                
                {% if form.non_field_errors %}
                    <div class="alert alert-danger" style="background: rgba(255, 77, 77, 0.1); border-color: rgba(255, 77, 77, 0.2); color: #ff6b6b;">
                        {{ form.non_field_errors }}
                    </div>
                {% endif %}

                <div id="form-container">
                    {{ form.as_p }}
                </div>

                <button type="submit" class="btn btn-aviation-glow w-100 mt-3 mb-3">Submit Registration</button>
                
                <div class="text-center mt-3">
                    <span class="text-white-50" style="font-size: 0.9rem;">Already have an account? <a href="{% url 'login' %}" class="brand-glow-text" style="text-decoration: none;">Sign in</a></span>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
